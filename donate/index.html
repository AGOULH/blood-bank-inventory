/* ---------- أدوات الحالة ---------- */
function waAll(){return Object.entries(WA.contacts).map(([p,c])=>({p,...c})).sort((a,b)=>(a.at||0)-(b.at||0)||a.p.localeCompare(b.p));}
function waRun(){return WA.runId?WA.runs[WA.runId]||null:null;}
function waSt(p){const r=waRun();return (r&&r.st&&r.st[p])||null;}
function waStatus(c){return c.opt?"opt":((waSt(c.p)||{}).s||"ready");}
function waElig(c){if(!c.ld)return "unknown";return (Date.now()-new Date(c.ld+"T00:00:00"))/864e5>=(+WA.set.eligDays||90)?"yes":"no";}
function waToday(){return ((WA.set.daily||{})[dkey(new Date())])||0;}
function waTpls(){
  const ov=WA.tplOv;
  const defs=WA_TPL_DEF.map(t=>ov[t.id]&&ov[t.id].content!=null?{...t,content:ov[t.id].content,modified:true}:t);
  const custom=Object.entries(ov).filter(([id])=>!WA_TPL_DEF.some(t=>t.id===id))
    .map(([id,v])=>({id,title:v.title||"رسالة",content:v.content||"",kind:"مخصصة",at:v.at||0,isDefault:false})).sort((a,b)=>a.at-b.at);
  return [...defs,...custom];
}
function waCurTpl(){const T=waTpls();return T.find(t=>t.id===WA.tplId)||T[0];}
function waFiltered(){
  const f=WA.f,q=f.q.trim().toLowerCase(),qd=waDigits(q).replace(/\D/g,"").replace(/^0+/,"");
  return waAll().filter(c=>{
    if(q&&!(String(c.n||"").toLowerCase().includes(q)||(qd&&c.p.includes(qd))))return false;
    if(f.bt&&(f.bt==="none"?c.bt:c.bt!==f.bt))return false;
    if(f.city&&c.city!==f.city)return false;
    if(f.elig&&waElig(c)!==f.elig)return false;
    const s=waStatus(c);
    return f.st?f.st===s:s!=="opt";
  });
}
/* طابور الإرسال: «تم الفتح» غير المؤكدة أولاً ثم الجاهزة، ويستبعد المرسل/الفاشل/غير الصالح و«لا ترسل» */
function waQueueList(){
  const skip=(WA.q&&WA.q.on&&WA.q.skip)||new Set();
  const L=waFiltered().filter(c=>{const s=waStatus(c);return (s==="ready"||s==="opened")&&!skip.has(c.p);});
  return L.filter(c=>waStatus(c)==="opened").concat(L.filter(c=>waStatus(c)==="ready"));
}
function waRunStats(r){
  r=r||waRun();const o={opened:0,sent:0,failed:0,invalid:0,rp:0,bk:0,at:0,att:0};
  if(!r||!r.st)return o;
  Object.values(r.st).forEach(e=>{if(o[e.s]!=null)o[e.s]++;if(e.s==="sent"||e.s==="opened")o.att++;if(e.rp)o.rp++;if(e.bk)o.bk++;if(e.at)o.at++;});
  return o;
}

/* ---------- بناء الرسالة ---------- */
function waVals(c,run){
  const s=WA.set,r=run||{};
  /* LRM بعد الفصيلة يمنع انقلابها إلى «+O» داخل جملة عربية في واتساب */
  const bt=c.bt?c.bt+"\u200E":"";
  return {"الاسم":c.n,"اسم":c.n,"name":c.n,"الفصيلة":bt,"فصيلة_الدم":bt,"blood_type":bt,
    "آخر_تبرع":c.ld?fmtDate(c.ld):"","موقع_الحملة":r.place||s.place,"رابط_الخريطة":r.mapUrl||s.mapUrl,
    "تاريخ_الحملة":r.date?fmtDate(r.date):"","مدة_الأهلية":s.eligDays};
}
function waCompose(tpl,c,run){
  const V=waVals(c,run);
  let t=String(tpl.content||"").replace(/\r\n?/g,"\n").replace(/\{([^{}\s]+)\}/g,(m,k)=>{const key=k in V?k:k.toLowerCase();return key in V?String(V[key]??""):m;});
  if(!t.includes("إيقاف"))t=t.trimEnd()+"\n\n"+WA_OPTOUT;
  return t;
}
function waMissing(content,c,run){
  const V=waVals(c,run),out=new Set();
  String(content||"").replace(/\{([^{}\s]+)\}/g,(m,k)=>{const key=k in V?k:k.toLowerCase();if(key in V&&(V[key]==null||V[key]===""))out.add("{"+k+"}");return m;});
  return [...out];
}
function waURL(p,text){
  const t=encodeURIComponent(text);
  return waMobile()?`https://wa.me/${p}?text=${t}`:`https://web.whatsapp.com/send?phone=${p}&text=${t}`;
}

  x.fillStyle=t.bgColor;x.fillRect(0,0,W,H);
  x.strokeStyle=t.accentColor;x.lineWidth=8;x.setLineDash(t.borderStyle==="dashed"?[20,10]:[]);x.strokeRect(30,30,W-60,H-60);x.setLineDash([]);

  x.font="bold 48px Cairo, sans-serif";x.fillStyle=t.textColor;x.fillText("شهادة شكر",W/2,150);

async function waSend(p,kind){

/* النتيجة: sent (بتأكيد المستخدم فقط) | failed | invalid (ليس على واتساب) | later (تبقى «تم الفتح») */
function waConfirm(res){
  const pd=WA.pend,r=waRun();if(!pd||!r)return;

    const upd=[waFP("st",p,"s"),res,waFP("st",p,res==="sent"?"ct":"ft"),now];
    if(res==="sent")upd.push(waFP("st",p,"n"),inc(1));
    w=ref.update(...upd);
  }
  if(w)w.catch(e=>toast(friendlyErr(e),"err"));
  if(res==="sent")waSetRef().set({daily:{[dkey(new Date())]:inc(1)}},{merge:true}).catch(()=>{});
  WA.pend=null;

  waQRender();
}

async function waFile(f){
  if(!f)return;
  if(!/\.(xlsx|xls|csv)$/i.test(f.name))return toast("الملف غير مدعوم — يرجى رفع ملف Excel أو CSV","err");
  try{await waXLSX();}catch(e){return toast(NET_ERR,"err");}
  let wb;
  try{wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array",cellDates:true});}
  catch(e){return toast("خطأ في قراءة الملف — تأكد من أن الملف بصيغة Excel صحيحة","err");}
  const sheets=wb.SheetNames.map(n=>waSheet(n,wb.Sheets[n])).filter(s=>s.rows.length);
  if(!sheets.length)return toast("الملف فارغ — لم يتم العثور على بيانات في الملف","err");
  sheets.sort((a,b)=>b.score-a.score);
  WA.imp={file:f.name,sheets,si:0,map:{...sheets[0].map}};
  $("#wa-drop-txt").innerHTML=`<p class="t g">${esc(f.name)}</p><p class="s">انقر لتغيير الملف</p>`;
  $("#wa-file").value="";

function waSheet(name,ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:false});
  let hi=0;
  for(let i=0;i<Math.min(5,aoa.length);i++){if(aoa[i].filter(v=>String(v).trim()!=="").length>=2){hi=i;break;}}
  const width=Math.max(0,...aoa.map(r=>r.length));
  let headers=Array.from({length:width},(_,i)=>String((aoa[hi]||[])[i]??"").trim()),rows=aoa.slice(hi+1);
  if(headers.some(h=>waNorm(h).ok)){rows=aoa.slice(hi);headers=headers.map(()=>"");} // لا يوجد صف عناوين
  headers=headers.map((h,i)=>h||("عمود "+(i+1)));
  const map=waDetect(headers,rows);
  return {name,headers,rows,hi,map,score:map.conf*1e6+rows.length};
}
/* اكتشاف الأعمدة بالعنوان (عربي/إنجليزي) + بالمحتوى معاً؛ «رقم الهوية/الملف» لا يُعدّ جوالاً، و«آخر تبرع» لا يُعدّ فصيلة */
function waDetect(headers,rows){
  const sample=rows.slice(0,200),S={n:[],p:[],b:[],c:[],d:[]};
  headers.forEach((h0,i)=>{
    const h=h0.toLowerCase(),vals=sample.map(r=>r[i]).filter(v=>String(v??"").trim()!==""),cnt=vals.length||1;
    const phoneOk=vals.filter(v=>waNorm(v).ok).length/cnt,btOk=vals.filter(v=>waBT(v,true)).length/cnt,dateOk=vals.filter(v=>waDate(v)).length/cnt;
    const textOk=vals.filter(v=>typeof v==="string"&&/[ء-يa-z]{2}/i.test(v)&&!/\d{4}/.test(waDigits(v))).length/cnt;
    let p=phoneOk*2;
    if(/جوال|موبايل|mobile|هاتف|phone|tel|واتس|whats|تواصل|contact/.test(h))p+=2;else if(/رقم|number|\bno\b/.test(h))p+=.5;
    if(/هوي|سجل|ملف|national|iqama|إقامة|اقامة|mrn|\bid\b|file|تبرع/.test(h))p-=3;
    let n=textOk;if(/اسم|name|المتبرع|donor/.test(h))n+=2;if(/مستخدم|user|ملف|file|حمل|مدين|city|فصيل|blood|جوال|phone/.test(h))n-=2;
    let b=btOk*2;if(/فصيل|blood|abo|group|زمرة/.test(h))b+=2;if(/تبرع|date|تاريخ|آخر|اخر|last/.test(h))b-=3;
    let c=0;if(/مدين|city|منطق|region|محافظ|الحي/.test(h))c+=3;
    let d=dateOk;if(/(آخر|اخر|last).*(تبرع|don)/.test(h))d+=3;else if(/تاريخ.*تبرع|donation.?date/.test(h))d+=2;
    S.p.push(p);S.n.push(n);S.b.push(b);S.c.push(c);S.d.push(d);
  });
  const used=new Set(),m={};
  [["p",1.2],["n",1],["b",1.5],["c",2],["d",1.5]].forEach(([k,min])=>{
    let best=-1,bs=min;S[k].forEach((v,i)=>{if(!used.has(i)&&v>=bs){bs=v;best=i;}});
    m[k]=best;if(best>=0)used.add(best);
  });
  m.conf=(m.p>=0?1:0)+(m.n>=0?1:0);
  return m;
}
function waImpCompute(){
  const I=WA.imp,s=I.sheets[I.si],m=I.map,seen=new Set(),ok=[],bad=[];let dup=0,upd=0,opt=0;
  s.rows.forEach((r,i)=>{
    const raw=m.p>=0?r[m.p]:"",nm=m.n>=0?String(r[m.n]??"").trim():"";
    if(String(raw??"").trim()===""&&!nm)return;
    const z=waNorm(raw);
    if(!z.ok){bad.push({row:s.hi+2+i,n:nm,raw:raw instanceof Date?"":String(raw??""),why:m.p<0?"لم يُحدَّد عمود الجوال":z.why});return;}
    if(seen.has(z.phone)){dup++;return;}
    seen.add(z.phone);
    const ex=WA.contacts[z.phone];if(ex){upd++;if(ex.opt)opt++;}
    ok.push({p:z.phone,n:nm||("شخص "+(i+1)),bt:m.b>=0?waBT(r[m.b]):"",city:m.c>=0?String(r[m.c]??"").trim():"",ld:m.d>=0?waDate(r[m.d]):""});
  });
  return {ok,bad,dup,upd,opt};
}
function waImpModal(){
  const I=WA.imp,s=I.sheets[I.si],R=waImpCompute();
  const sampleOf=i=>{const v=(s.rows.find(r=>String(r[i]??"").trim()!=="")||[])[i];return v==null?"":v instanceof Date?waISO(v):String(v).slice(0,18);};
  const opts=k=>`<option value="-1">— لا يوجد —</option>`+s.headers.map((h,i)=>{const sm=sampleOf(i);return `<option value="${i}" ${I.map[k]===i?"selected":""}>${esc(h)}${sm?" — مثال: "+esc(sm):""}</option>`;}).join("");
  const F=[["n","الاسم",0],["p","رقم الجوال",1],["b","فصيلة الدم",0],["c","المدينة",0],["d","آخر تبرع",0]];
  const auto=I.map.p>=0&&I.map.n>=0;
  $("#modal-box").style.maxWidth="760px";
  $("#modal-box").innerHTML=`<div class="wa" data-testid="wa-import-modal"><h3>مراجعة الملف: ${esc(I.file)}</h3>
    ${I.sheets.length>1?`<div><label class="wa-lbl" for="wa-imp-sheet">الورقة</label><select class="wa-in" id="wa-imp-sheet" onchange="waImpSheet(+this.value)" data-testid="wa-import-sheet">${I.sheets.map((x,i)=>`<option value="${i}" ${i===I.si?"selected":""}>${esc(x.name)} (${x.rows.length} صف)</option>`).join("")}</select></div>`:""}
    <p class="wa-hint" style="font-size:13px">${auto?"✓ تم اكتشاف الأعمدة تلقائياً — راجعها وعدّلها عند الحاجة.":"⚠️ لم يُكتشف عمود الاسم أو الجوال بثقة — اربط الأعمدة يدوياً من القوائم."}</p>
    <div class="wa-form">${F.map(([k,l,req])=>`<div><label for="wa-map-${k}">${l}${req?" *":""}</label><select class="wa-in" id="wa-map-${k}" onchange="waImpMap('${k}',+this.value)" data-testid="wa-map-${k}">${opts(k)}</select></div>`).join("")}</div>
    <div class="wa-kpis" data-testid="wa-import-summary">
      <div class="wa-kpi hl"><b>${R.ok.length}</b><span>رقم صالح</span></div><div class="wa-kpi"><b>${R.ok.length-R.upd}</b><span>جديد</span></div>
      <div class="wa-kpi"><b>${R.upd}</b><span>موجود (يُحدَّث)</span></div><div class="wa-kpi"><b>${R.dup}</b><span>مكرر في الملف</span></div>
      <div class="wa-kpi"><b>${R.bad.length}</b><span>مرفوض</span></div></div>
    ${R.opt?`<p class="wa-hint">🚫 ${R.opt} من هذه الأرقام في «لا ترسل» وسيبقى مستبعداً.</p>`:""}
    ${R.bad.length?`<details ${R.ok.length?"":"open"}><summary class="wa-lbl" style="cursor:pointer">الأرقام المرفوضة وأسبابها (${R.bad.length})</summary>
      <div class="wa-scroll" style="margin-top:8px"><table class="wa-tbl" data-testid="wa-import-rejected"><thead><tr><th>الصف</th><th>الاسم</th><th>القيمة</th><th>السبب</th></tr></thead>
      <tbody>${R.bad.slice(0,200).map(b=>`<tr><td>${b.row}</td><td>${esc(b.n)}</td><td dir="ltr">${esc(b.raw)}</td><td>${esc(b.why)}</td></tr>`).join("")}</tbody></table></div></details>`:""}
    <div class="wa-row"><button class="wa-btn red" onclick="waImpDo()" ${R.ok.length?"":"disabled"} data-testid="wa-import-confirm">${waI("upload")}استيراد ${R.ok.length} رقم</button>
      ${R.bad.length?`<button class="wa-btn out" onclick="waImpBadXLSX()" data-testid="wa-import-export-rejected">${waI("download")}تصدير المرفوضين Excel</button>`:""}
      <button class="wa-btn out" onclick="closeModal()" data-testid="wa-import-cancel">إلغاء</button></div></div>`;
  if(!$("#modal-bg").classList.contains("open"))openModal();
}
function waImpSheet(i){WA.imp.si=i;WA.imp.map={...WA.imp.sheets[i].map};waImpModal();const s=$("#wa-imp-sheet");if(s)s.focus();}
function waImpMap(k,v){
  const M=WA.imp.map;if(v>=0)Object.keys(M).forEach(x=>{if(x!==k&&M[x]===v)M[x]=-1;});M[k]=v;
  waImpModal();const s=$("#wa-map-"+k);if(s)s.focus();
}
async function waImpDo(){
  const R=waImpCompute();if(!R.ok.length)return;
  const by={},now=Date.now();
  R.ok.forEach((c,i)=>{
    const sh="s"+c.p.slice(-1),d={n:c.n};
    if(c.bt)d.bt=c.bt;if(c.city)d.city=c.city;if(c.ld)d.ld=c.ld;if(!WA.contacts[c.p])d.at=now+i;
    (by[sh]=by[sh]||{})[c.p]=d;
  });
  /* حد وثيقة Firestore 1MB — نتحقق من حجم كل جزء قبل الكتابة */
  for(const [sh,m] of Object.entries(by)){
    const cur={};Object.entries(WA.contacts).forEach(([p,c])=>{if("s"+p.slice(-1)===sh)cur[p]=c;});
    if(JSON.stringify({...cur,...m}).length>950000)return toast("القائمة تتجاوز سعة التخزين — قسّم الملف أو احذف جهات قديمة","err");
  }
  const btn=$("[data-testid=wa-import-confirm]");btn.disabled=true;btn.textContent="جارِ الحفظ…";
  try{
    const b=db.batch();Object.entries(by).forEach(([sh,m])=>b.set(db.collection("wa_contacts").doc(sh),{c:m},{merge:true}));
    await b.commit();
    closeModal();WA.imp=null;
    toast(`تم تحميل ${R.ok.length} جهة اتصال — يمكنك الآن إرسال رسائل واتساب`);
  }catch(e){btn.disabled=false;btn.textContent="استيراد";toast(friendlyErr(e),"err");}
}

  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([["الصف","الاسم","القيمة الأصلية","السبب"],...R.bad.map(b=>[b.row,b.n,b.raw,b.why])]);
  ws["!cols"]=[{wch:6},{wch:22},{wch:20},{wch:40}];wb.Workbook={Views:[{RTL:true}]};

/* ---------- تقرير الإرسال ---------- */
async function waReportXLSX(){
  const r=waRun();if(!r)return toast("لا توجد حملة إرسال بعد","err");
  try{await waXLSX();}catch(e){return toast(NET_ERR,"err");}
  const L={opened:"تم الفتح (غير مؤكد)",sent:"تم الإرسال ✓",failed:"فشل",invalid:"غير صالح"};
  const T=t=>t?new Date(t).toLocaleString("ar-SA-u-nu-latn"):"",yes=v=>v?"نعم":"";
  const rows=[["الاسم","الجوال","الفصيلة","المدينة","آخر تبرع","الحالة","وقت الفتح","وقت التأكيد","مرات الإرسال","رد","حجز","حضر","الشهادة"]];
  new Set([...Object.keys(WA.contacts),...Object.keys(r.st||{})]).forEach(p=>{
    const c=WA.contacts[p]||{},e=(r.st||{})[p]||{};
    rows.push([c.n||"","+"+p,c.bt||"",c.city||"",c.ld||"",c.opt?"لا ترسل":(L[e.s]||"جاهز"),T(e.t),T(e.ct),e.n||0,yes(e.rp),yes(e.bk),yes(e.at),e.cs==="sent"?"أُرسلت":e.cs?"فُتحت":""]);
  });
  const S=waRunStats(r);
  const sum=[["حملة الإرسال",r.name],["التاريخ",r.date||""],["الموقع",r.place||""],["مُرسل (فُتحت المحادثة)",S.att],["مؤكد",S.sent],["رد",S.rp],["حجز",S.bk],["حضر",S.at],
    ["نسبة التحويل (حضر ÷ مؤكد)",(S.sent?Math.round(S.at/S.sent*100):0)+"%"],["فشل / غير صالح",S.failed+S.invalid],["تاريخ التصدير",T(Date.now())]];
  const wb=XLSX.utils.book_new(),ws1=XLSX.utils.aoa_to_sheet(sum),ws2=XLSX.utils.aoa_to_sheet(rows);
  ws1["!cols"]=[{wch:26},{wch:30}];ws2["!cols"]=[{wch:22},{wch:16},{wch:8},{wch:12},{wch:12},{wch:18},{wch:20},{wch:20},{wch:10},{wch:6},{wch:6},{wch:6},{wch:10}];
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws1,"الملخص");XLSX.utils.book_append_sheet(wb,ws2,"التفاصيل");
  XLSX.writeFile(wb,"تقرير-إرسال-"+String(r.name).replace(/[\\/:*?"<>|]/g,"-")+".xlsx");
}

/* ---------- الاستيراد من النسخة القديمة ---------- */
function waLegacyModal(){
  $("#modal-box").style.maxWidth="640px";
  $("#modal-box").innerHTML=`<div class="wa" data-testid="wa-legacy-modal"><h3>استيراد من النسخة القديمة</h3>
    <ol style="margin:0;padding-inline-start:20px;line-height:2;font-size:14px">
      <li>افتح الموقع القديم في نفس المتصفح الذي كنت تستخدمه، وسجّل دخولك.</li>
      <li>اضغط <b dir="ltr">F12</b> ثم تبويب <b dir="ltr">Console</b>، والصق السكربت أدناه واضغط Enter.</li>
      <li>سيُنزَّل ملف <b dir="ltr">whatsapp-sender-backup.json</b> — اختره هنا.</li></ol>
    <textarea class="wa-in" rows="4" dir="ltr" readonly id="wa-legacy-script" style="font-family:ui-monospace,Menlo,monospace;font-size:11px" data-testid="wa-legacy-script">${esc(WA_LEGACY_SCRIPT)}</textarea>
    <div class="wa-row"><button class="wa-btn out" onclick="navigator.clipboard.writeText(WA_LEGACY_SCRIPT).then(()=>toast('نُسخ السكربت ✓'),()=>{$('#wa-legacy-script').select();toast('انسخه يدوياً (Ctrl+C)')})" data-testid="wa-legacy-copy">نسخ السكربت</button>
      <input type="file" id="wa-legacy-file" accept=".json,application/json" hidden onchange="waLegacyFile(this.files[0])" data-testid="wa-legacy-file">
      <button class="wa-btn red" onclick="$('#wa-legacy-file').click()" data-testid="wa-legacy-choose">${waI("upload")}اختيار ملف JSON</button>
      <button class="wa-btn out" onclick="closeModal()">إغلاق</button></div>
    <p class="wa-hint">السكربت لا ينقل كلمة المرور. الجهات التي كانت «أُرسل» في النسخة القديمة تُستورد كـ «تم الفتح» لأن القديم كان يسجّلها بمجرد فتح الرابط دون تأكيد.</p></div>`;

async function waLegacyFile(f){
  if(!f)return;
  let o;try{o=JSON.parse(await f.text());}catch(e){return toast("ملف غير صالح — اختر الملف الناتج من السكربت","err");}
  const arr=v=>Array.isArray(v)?v:[];
  const list=[...arr(o.uploadedContacts),...Object.keys(o).filter(k=>/^hospital-.*-contacts$/.test(k)).flatMap(k=>arr(o[k]))];
  const by={},st={},seen=new Set(),now=Date.now();let ok=0,bad=0;
  list.forEach((c,i)=>{
    const z=waNorm(c&&c.phone);if(!z.ok){bad++;return;}
    if(seen.has(z.phone))return;seen.add(z.phone);ok++;
    const d={n:String(c.name||("شخص "+(i+1))).trim()};const bt=waBT(c.bloodType||"");if(bt)d.bt=bt;if(!WA.contacts[z.phone])d.at=now+i;
    (by["s"+z.phone.slice(-1)]=by["s"+z.phone.slice(-1)]||{})[z.phone]=d;
    if(c.sent||c.sendCount>0)st[z.phone]={s:"opened",n:+c.sendCount||0,t:now,legacy:true};
  });
  const msgs=arr(o.savedMessages).filter(m=>m&&!m.isDefault&&m.title&&m.content);
  if(!ok&&!msgs.length)return toast("لا توجد بيانات قابلة للاستيراد في الملف","err");
  try{
    const b=db.batch();
    Object.entries(by).forEach(([sh,m])=>b.set(db.collection("wa_contacts").doc(sh),{c:m},{merge:true}));
    msgs.forEach((m,i)=>b.set(db.collection("wa_templates").doc("legacy-"+String(m.id||i).replace(/[^\w-]/g,"")),{title:String(m.title),content:String(m.content),at:now+i}));
    let runId=null;
    if(Object.keys(st).length){const ref=db.collection("wa_sends").doc();runId=ref.id;b.set(ref,{name:"مستورد من النسخة القديمة",date:waISO(new Date()),place:WA.set.place,mapUrl:WA.set.mapUrl,at:now,st,legacy:true});}
    await b.commit();
    if(runId)waSetRun(runId);
    closeModal();
    toast(`استُورد ${ok} جهة اتصال و${msgs.length} رسالة${bad?` — رُفض ${bad} رقم غير صالح`:""}`);
  }catch(e){toast(friendlyErr(e),"err");}
}
